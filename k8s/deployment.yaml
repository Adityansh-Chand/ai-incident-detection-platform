apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: incident-detection-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-detection
  labels:
    app: incident-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-detection
  template:
    metadata:
      labels:
        app: incident-detection
    spec:
      containers:
        - name: api
          image: incident-detection:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: incident-detection-secrets
                  key: api-key
                  optional: true
            - name: APP_DB_PATH
              value: /data/app.sqlite3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: incident-detection-data
---
apiVersion: v1
kind: Service
metadata:
  name: incident-detection
spec:
  selector:
    app: incident-detection
  ports:
    - port: 80
      targetPort: 8000
